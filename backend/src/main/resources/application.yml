spring:
  application:
    name: diamond

  datasource:
    url: jdbc:postgresql://localhost:5432/diamond_db
    username: diamond_user
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: "thisIsAVeryLongSecretKeyForDiamondProjectMinimum256Bits!!"
  access-expiration: 3600000
  refresh-expiration: 1209600000